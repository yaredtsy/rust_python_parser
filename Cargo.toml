[package]
name = "pylspt"
version = "0.1.0"
edition = "2024"

[dependencies]
# --- ruff/ty, all from ONE local checkout at vendor/ruff, pinned ac201b8 ---
# vendor/ruff/Cargo.toml is ruff's own, UNCHANGED — every `workspace = true`
# line in vendor/ruff/crates/* resolves against it, not against this file.
# This Cargo.toml has no [workspace], so it is not that root; it is just the
# pylspt package, depending on 26 of ruff/ty's crates by path.
ruff_db = { path = "vendor/ruff/crates/ruff_db", default-features = false, features = [
    "os",
] }
ruff_python_ast = { path = "vendor/ruff/crates/ruff_python_ast" }
ruff_python_stdlib = { path = "vendor/ruff/crates/ruff_python_stdlib" }
ruff_source_file = { path = "vendor/ruff/crates/ruff_source_file" }
ruff_text_size = { path = "vendor/ruff/crates/ruff_text_size" }
ty_module_resolver = { path = "vendor/ruff/crates/ty_module_resolver" }
# "zstd": ty_project's own default feature. `default-features = false` is
# what ruff's own root table uses for it too — safe there only because
# ruff's own `ty` binary crate re-enables zstd itself (`crates/ty/Cargo.toml`).
# We are that binary here, so we re-enable it too — without it,
# vendored-typeshed decompression breaks silently.
ty_project = { path = "vendor/ruff/crates/ty_project", default-features = false, features = [
    "zstd",
] }
ty_python_core = { path = "vendor/ruff/crates/ty_python_core" }
ty_python_semantic = { path = "vendor/ruff/crates/ty_python_semantic" }

# --- shared with ruff: copied verbatim from vendor/ruff/Cargo.toml, not
# retyped, so cargo's feature unification keeps exactly one of each in the
# graph (two salsa copies would mean two incompatible `Db` traits) ---
salsa = { version = "0.28.2", default-features = false, features = [
    "compact_str",
    "macros",
    "salsa_unstable",
    "inventory",
] }
rustc-hash = { version = "2.0.0" }
thin-vec = { version = "0.2.14" }
uuid = { version = "1.6.1", features = ["v4"] }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = { version = "1.0.113" }
anyhow = { version = "1.0.80" }
smallvec = { version = "1.13.2", features = [
    "union",
    "const_generics",
    "const_new",
] }

[dev-dependencies]
# Only `#[cfg(test)]` modules parse directly (`parse_unchecked`) rather than
# through `ruff_db`'s `parsed_module` — no standalone `scan` binary needs
# this any more (retired; see `src/scan.rs`'s module doc).
ruff_python_parser = { path = "vendor/ruff/crates/ruff_python_parser" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
