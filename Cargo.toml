[package]
name = "pylspt"
version = "0.1.0"
edition = "2024"

# pylspt is the workspace ROOT — not nested inside a ruff clone. `vendor/`
# holds a trimmed copy of just the ruff/ty crates `ty_python_semantic`
# actually needs (its real dependency closure, not hand-picked), each one
# untouched except `vendor/ty_python_semantic/src/types/vnoc.rs` — see
# `vendor/ty_python_semantic/src/types/vnoc.rs`'s own doc comment for the
# fork discipline. One workspace, one salsa, one `ruff_db::File` — which is
# the entire reason to vendor the closure rather than pick crates from two
# different sources (one git dep, one local copy): Cargo treats a crate from
# a different source as a different crate even when name and version match,
# so a mixed source would link two incompatible `ruff_db`/`salsa` copies and
# `ty`'s `Db` trait would not type-check against our own queries.
[workspace]
members = ["vendor/*"]

# Vendored crates reference these via `field = { workspace = true }` — copied
# from ruff's own `[workspace.package]` at the pinned rev so their Cargo.tomls
# need no edits.
[workspace.package]
edition = "2024"
rust-version = "1.96"
homepage = "https://docs.astral.sh/ruff"
documentation = "https://docs.astral.sh/ruff"
repository = "https://github.com/astral-sh/ruff"
authors = ["Charlie Marsh <charlie.r.marsh@gmail.com>"]
license = "MIT"

[workspace.dependencies]
# --- vendored ruff/ty crates (path = vendor/<name>) ---
ruff_annotate_snippets = { version = "0.0.11", path = "vendor/ruff_annotate_snippets" }
ruff_cache = { version = "0.0.11", path = "vendor/ruff_cache" }
ruff_db = { version = "0.0.11", path = "vendor/ruff_db", default-features = false }
ruff_diagnostics = { version = "0.0.11", path = "vendor/ruff_diagnostics" }
ruff_index = { version = "0.0.11", path = "vendor/ruff_index" }
ruff_macros = { version = "0.0.11", path = "vendor/ruff_macros" }
ruff_memory_usage = { version = "0.0.11", path = "vendor/ruff_memory_usage" }
ruff_notebook = { version = "0.0.11", path = "vendor/ruff_notebook" }
ruff_options_metadata = { version = "0.0.11", path = "vendor/ruff_options_metadata" }
ruff_python_ast = { version = "0.0.11", path = "vendor/ruff_python_ast" }
ruff_python_edits = { version = "0.0.11", path = "vendor/ruff_python_edits" }
ruff_python_literal = { version = "0.0.11", path = "vendor/ruff_python_literal" }
ruff_python_parser = { version = "0.0.11", path = "vendor/ruff_python_parser" }
ruff_python_stdlib = { version = "0.0.11", path = "vendor/ruff_python_stdlib" }
ruff_python_trivia = { version = "0.0.11", path = "vendor/ruff_python_trivia" }
ruff_ranged_value = { version = "0.0.11", path = "vendor/ruff_ranged_value" }
ruff_source_file = { version = "0.0.11", path = "vendor/ruff_source_file" }
ruff_text_size = { version = "0.0.11", path = "vendor/ruff_text_size" }
ty_combine = { version = "0.0.11", path = "vendor/ty_combine" }
ty_module_resolver = { version = "0.0.11", path = "vendor/ty_module_resolver" }
ty_project = { path = "vendor/ty_project", default-features = false }
ty_python_core = { version = "0.0.11", path = "vendor/ty_python_core" }
ty_python_semantic = { version = "0.0.11", path = "vendor/ty_python_semantic" }
ty_site_packages = { version = "0.0.11", path = "vendor/ty_site_packages" }
ty_static = { version = "0.0.11", path = "vendor/ty_static" }
ty_vendored = { version = "0.0.11", path = "vendor/ty_vendored" }

# --- external crates, same version/features ruff pins ---
aho-corasick = { version = "1.1.3" }
anstyle = { version = "1.0.10" }
anyhow = { version = "1.0.80" }
arc-swap = { version = "1.7.1" }
arrayvec = { version = "0.7.6" }
bitflags = { version = "2.5.0" }
bitvec = { version = "1.0.1", default-features = false, features = [
    "alloc",
] }
bstr = { version = "1.9.1" }
camino = { version = "1.1.7" }
char_str = { version = "0.0.2" }
colored = { version = "3.0.0" }
compact_str = "0.10.0"
crossbeam = { version = "0.8.4" }
dashmap = { version = "6.0.1" }
drop_bomb = { version = "0.1.5" }
dunce = { version = "1.0.5" }
filetime = { version = "0.2.23" }
get-size2 = { version = "0.10.3", features = [
    "derive",
    "smallvec",
    "hashbrown",
    "compact-str",
    "ordermap",
    "thin-vec",
] }
glob = { version = "0.3.1" }
globset = { version = "0.4.14" }
hashbrown = { version = "0.17.0", default-features = false, features = [
    "inline-more",
] }
heck = "0.5.0"
icu_properties = { version = "2.1.2" }
ignore = { version = "0.4.30" }
indexmap = { version = "2.6.0" }
is-macro = { version = "0.3.5" }
itertools = { version = "0.15.0" }
matchit = { version = "0.9.0" }
memchr = { version = "2.7.1" }
notify = { version = "8.0.0" }
ordermap = { version = "1.0.0" }
parking_lot = { version = "0.12.4" }
path-slash = { version = "0.2.1" }
pathdiff = { version = "0.2.1" }
pep440_rs = { version = "0.7.1" }
proc-macro2 = { version = "1.0.79" }
quick-junit = { version = "0.6.0" }
quote = { version = "1.0.23" }
rand = { version = "0.10.0", default-features = false, features = ["std_rng"] }
rayon = { version = "1.10.0" }
regex = { version = "1.10.2" }
regex-automata = { version = "0.4.9" }
regex-syntax = { version = "0.8.8" }
rustc-hash = { version = "2.0.0" }
salsa = { version = "0.28.2", default-features = false, features = [
    "compact_str",
    "macros",
    "salsa_unstable",
    "inventory",
] }
same-file = { version = "1.0.6" }
schemars = { version = "1.0.4" }
seahash = { version = "4.1.0" }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = { version = "1.0.113" }
shellexpand = { version = "3.0.0" }
similar = { version = "3.0.0", features = ["inline"] }
smallvec = { version = "1.13.2", features = ["union", "const_generics", "const_new"] }
stacker = "0.1.24"
static_assertions = "1.1.0"
strum = { version = "0.28.0", features = ["strum_macros"] }
strum_macros = { version = "0.28.0" }
supports-hyperlinks = { version = "3.1.0" }
syn = { version = "3.0.0" }
thin-vec = { version = "0.2.14" }
thiserror = { version = "2.0.0" }
toml = { version = "1.0.0" }
tracing = { version = "0.1.40" }
tracing-subscriber = { version = "0.3.18", default-features = false, features = [
    "env-filter",
    "fmt",
    "ansi",
    "smallvec",
] }
unicode-ident = { version = "1.0.12" }
unicode-normalization = { version = "0.1.23" }
unicode-width = { version = "0.2.0" }
unicode_names2 = { version = "1.2.2" }
uuid = { version = "1.6.1" }
which = { version = "8.0.0" }
zip = { version = "8.0", default-features = false }

[dependencies]
# ruff and ty: one copy each, from this workspace (vendor/)
ruff_db = { workspace = true, features = ["os"] }
ruff_python_ast = { workspace = true }
ruff_source_file = { workspace = true }
ruff_text_size = { workspace = true }
ty_module_resolver = { workspace = true }
# "zstd": ty_project's own default feature, which the workspace.dependencies
# entry above disables (copied verbatim from ruff's root table, where ruff's
# own `ty` binary re-enables it explicitly the same way) — without this,
# vendored-typeshed decompression breaks silently.
ty_project = { workspace = true, features = ["zstd"] }
ty_python_core = { workspace = true }
ty_python_semantic = { workspace = true }

# shared with ruff: same versions and features as ruff uses
salsa = { workspace = true }
rustc-hash = { workspace = true }
thin-vec = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
# Only `#[cfg(test)]` modules parse directly (`parse_unchecked`) rather than
# through `ruff_db`'s `parsed_module` — no standalone `scan` binary needs
# this any more (retired; see `src/scan.rs`'s module doc).
ruff_python_parser = { workspace = true }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
